[package]
name = "tianjin_ds_sqlite"
version = "0.1.0"
description = "2027天津专升本数据结构基础填空"
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[lib]
name = "tianjin_ds_sqlite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-sql = { version = "=2.6.0", features = ["sqlite"] }
