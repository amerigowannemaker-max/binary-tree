;flex-wrap:wrap;gap:8px;margin-top:11px}.review button{border:1px solid #dce2ed;border-radius:7px;background:white;padding:6px 10px;font-size:12px;color:#526179}.navigator{display:flex;gap:8px;margin-top:14px}.navigator button{flex:1;border:1px solid var(--border);background:var(--panel);padding:11px;border-radius:10px;color:var(--ink);font-weight:650}.navigator button:last-child{color:var(--accent)}.empty{text-align:center;padding:50px 12px}.empty p{font-size:13px;color:var(--sub)}.mini{font-size:12px;color:var(--sub);text-align:center;margin:18px 0}.settings{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}.settings summary{cursor:pointer;font-size:13px;font-weight:700;color:#56647c;outline-offset:5px}.settingscontent{margin-top:13px;display:flex;gap:8px;flex-wrap:wrap}.settings button{background:white;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px}.footer{padding-top:17px;text-align:center;font-size:11px;color:#8b96a8}.footer a{color:#526fbd;text-decoration:none}#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,16px);background:#19294b;color:white;padding:9px 15px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;z-index:3}#toast.show{opacity:1;transform:translate(-50%,0)}.modehint{color:#8490a3;font-size:11px}.tiny{font-size:11px}@media(max-width:500px){.wrap{padding:16px 12px 36px}h1{font-size:20px}.card{padding:17px 16px;min-height:310px}.prompt{font-size:18px;margin:23px 0 21px}.stats{gap:13px}.stat strong{font-size:18px}.primary,.secondary{padding:11px 8px}.smallbtn{padding:7px 10px}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111723;--panel:#1b2434;--ink:#edf3ff;--sub:#acb8cc;--border:#344259;--accent:#82a0ff;--accentbg:#27345e;--good:#51d9a1;--bad:#ff8390;--ring:#597dff2e}.countpill{background:#293663;color:#a8bbff}.bar{background:#2c384e}.chip.active{background:#446ef0;color:#fff;border-color:#446ef0}.seg{background:#273348}.seg button.active{background:#38445e}.star{background:#2d3a50}.star.on{background:#5b4a22}.answer{background:#202c40!important;color:var(--ink)!important;border-color:#43516b!important}.secondary,.navigator button,.settings button,.review button{background:#222d40;color:var(--ink);border-color:var(--border)}.result{background:#222f42}.result.good{background:#173d31;border-color:#326b55}.result.bad{background:#482932;border-color:#81535c}.explain{color:#bac6d9}.eyebrow{color:var(--sub)}}

.cardActions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}

.review button.wrongToggle.on{background:#fff0f1;border-color:#e6a0a8;color:#b72439;font-weight:750}
@media(prefers-color-scheme:dark){.wrongBook{background:#29364c;border-color:#40506b;color:#c2ccdc}.wrongBook.on,.review button.wrongToggle.on{background:#512a36;color:#ffacb6;border-color:#a25e6a}}

<body>
<main class="wrap">
<header class="header"><div><div class="kicker">2027 天津专升本 · 数据结构</div><h1>基础知识填空</h1><div class="muted">单空短答 · 九章覆盖 · 不含复杂算法题</div></div><div class="countpill" id="totalTag">— 题</div></header>
